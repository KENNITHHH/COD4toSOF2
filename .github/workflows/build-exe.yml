name: build CoD4toSOF2.exe

# Builds the Windows exe on GitHub's runners, so a release does not depend on
# anyone's local Python. Runs on every push to main (artifact kept 30 days)
# and attaches a zip to any tag starting with v.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow numpy customtkinter

      - name: Syntax check every module
        run: python -m compileall -q .

      - name: GUI smoke test (builds every widget against a fake tkinter)
        run: python gui_smoke_test.py

      - name: Build
        run: python -m PyInstaller --noconfirm CoD4toSOF2.spec

      - name: Smoke test (the exe must run a step and print its help)
        run: dist\CoD4toSOF2.exe --step map --help

      - uses: actions/upload-artifact@v4
        with:
          name: CoD4toSOF2-windows
          path: dist/CoD4toSOF2.exe
          retention-days: 30

      - name: Zip for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist\CoD4toSOF2.exe -DestinationPath CoD4toSOF2-${{ github.ref_name }}.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: CoD4toSOF2-${{ github.ref_name }}.zip
